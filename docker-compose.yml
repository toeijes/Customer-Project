services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      - TZ=Asia/Bangkok
      - NODE_ENV=production
      - TRUST_PROXY=1
    expose:
      - "5000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3015:80"
    depends_on:
      - backend
