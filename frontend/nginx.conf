server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend container
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        # Preserve the browser-facing host *and port*. The backend compares this
        # with the Origin header for state-changing requests (PUT/POST/DELETE).
        # `$host` can omit the port, causing a valid same-site request such as
        # http://server:3015 to be rejected as an untrusted origin.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
