<body class="overflow-x-hidden text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- MOCK DATABASE (กปภ.ข.6 ข้อมูลตัวอย่างเสมือนจริง) ---
    const MOCK_BRANCHES = [
      { id: 1, name: 'ขอนแก่น', province: 'ขอนแก่น' },
      { id: 2, name: 'บ้านไผ่', province: 'ขอนแก่น' },
      { id: 3, name: 'ชุมแพ', province: 'ขอนแก่น' },
      { id: 4, name: 'เลย', province: 'เลย' },
      { id: 5, name: 'ชัยภูมิ', province: 'ชัยภูมิ' },
      { id: 6, name: 'กาฬสินธุ์', province: 'กาฬสินธุ์' },
      { id: 7, name: 'มหาสารคาม', province: 'มหาสารคาม' },
      { id: 8, name: 'ร้อยเอ็ด', province: 'ร้อยเอ็ด' }
    ];

    const MOCK_PROJECTS = [
      {
        id: 1,
        project_code: 'PWA6-64-001',
        contract_no: 'กปภ.ข.6-01/2564',
        branch_name: 'ขอนแก่น',
        project_name: 'โครงการขยายเขตจำหน่ายน้ำบริการประชาชน ต.ศิลา อ.เมืองขอนแก่น',
        project_type: 1, // 1 = งบลงทุน
        start_year: 2564,
        completion_year: 2564,
        budget: 4500000.00,
        target_users: 100,
        // ข้อมูลรายปีสะสม (ปี 0: 40%, ปี 1-4: 15% ต่อปี)
        yearly_actuals: { 2564: 30, 2565: 15, 2566: 20, 2567: 15, 2568: 15, 2569: 10 }
      },
      {
        id: 2,
        project_code: 'PWA6-64-002',
        contract_no: 'กปภ.ข.6-05/2564',
        branch_name: 'มหาสารคาม',
        project_name: 'โครงการขยายเขตจำหน่ายน้ำบ้านดอนยม ต.เกิ้ง อ.เมืองมหาสารคาม',
        project_type: 2, // 2 = งบอุดหนุน
        start_year: 2564,
        completion_year: 2564,
        budget: 2800000.00,
        target_users: 80,
        yearly_actuals: { 2564: 35, 2565: 10, 2566: 12, 2567: 11, 2568: 10, 2569: 5 }
      },
      {
        id: 3,
        project_code: 'PWA6-65-012',
        contract_no: 'สส.ข.6-08/2565',
        branch_name: 'ชัยภูมิ',
        project_name: 'โครงการเพิ่มขยายเขตจำหน่ายน้ำเพื่อฟื้นฟูเศรษฐกิจ ต.ในเมือง อ.เมืองชัยภูมิ',
        project_type: 3, // 3 = งบกระตุ้นเศรษฐกิจ
        start_year: 2565,
        completion_year: 2565,
        budget: 5200000.00,
        target_users: 150,
        yearly_actuals: { 2565: 55, 2566: 25, 2567: 20, 2568: 25, 2569: 30 }
      },
      {
        id: 4,
        project_code: 'PWA6-64-004',
        contract_no: 'สญ.วท-44/2564',
        branch_name: 'บ้านไผ่',
        project_name: 'โครงการวางท่อเข้าซอยพัฒนาสุข ถ.เจนจดิศ บ้านไผ่',
        project_type: 4, // 4 = วางท่อเข้าซอย
        start_year: 2564,
        completion_year: 2564,
        budget: 450000.00,
        target_users: 25,
        yearly_actuals: { 2564: 28 } // คุ้มทุนแค่ปีที่แล้วเสร็จ (ปีเดียว)
      },
      {
        id: 5,
        project_code: 'PWA6-65-020',
        contract_no: 'สญ.วท-59/2565',
        branch_name: 'ร้อยเอ็ด',
        project_name: 'โครงการวางท่อเข้าซอยสุวรรณภูมิ ซอย 5 อ.สุวรรณภูมิ',
        project_type: 4,
        start_year: 2565,
        completion_year: 2565,
        budget: 380000.00,
        target_users: 20,
        yearly_actuals: { 2565: 18 }
      },
      {
        id: 6,
        project_code: 'PWA6-65-003',
        contract_no: 'กปภ.ข.6-11/2565',
        branch_name: 'เลย',
        project_name: 'โครงการขยายเขตจำหน่ายน้ำ ต.กุดป่อง อ.เมืองเลย (งบลงทุน)',
        project_type: 1,
        start_year: 2565,
        completion_year: 2565,
        budget: 6800000.00,
        target_users: 200,
        yearly_actuals: { 2565: 90, 2566: 35, 2567: 28, 2568: 32, 2569: 25 }
      },
      {
        id: 7,
        project_code: 'PWA6-66-001',
        contract_no: 'กปภ.ข.6-02/2566',
        branch_name: 'กาฬสินธุ์',
        project_name: 'โครงการขยายเขตระบบประปา ต.หลุบ อ.เมืองกาฬสินธุ์',
        project_type: 1,
        start_year: 2566,
        completion_year: 2566,
        budget: 3900000.00,
        target_users: 120,
        yearly_actuals: { 2566: 45, 2567: 22, 2568: 20, 2569: 18 }
      },
      {
        id: 8,
        project_code: 'PWA6-66-005',
        contract_no: 'สญ.วท-02/2566',
        branch_name: 'ชุมแพ',
        project_name: 'โครงการวางท่อเข้าซอยร่วมใจพัฒนา ถนนมะลิวัลย์ อ.ชุมแพ',
        project_type: 4,
        start_year: 2566,
        completion_year: 2566,
        budget: 310000.00,
        target_users: 15,
        yearly_actuals: { 2566: 16 }
      }
    ];

    // ข้อมูลจำลองรายเดือนของผู้ใช้จริงรายสาขา (อิงปีงบประมาณ เริ่ม ต.ค. - ก.ย.)
    const MONTHS_TH = [
      { num: 10, name: 'ตุลาคม' },
      { num: 11, name: 'พฤศจิกายน' },
      { num: 12, name: 'ธันวาคม' },
      { num: 1, name: 'มกราคม' },
      { num: 2, name: 'กุมภาพันธ์' },
      { num: 3, name: 'มีนาคม' },
      { num: 4, name: 'เมษายน' },
      { num: 5, name: 'พฤษภาคม' },
      { num: 6, name: 'มิถุนายน' },
      { num: 7, name: 'กรกฎาคม' },
      { num: 8, name: 'สิงหาคม' },
      { num: 9, name: 'กันยายน' }
    ];

    const FISCAL_YEARS = [2564, 2565, 2566, 2567, 2568, 2569];

    // เจนเนอเรตข้อมูลรายเดือนอ้างอิงจากรายโครงการเพื่อความเที่ยงตรงของฐานข้อมูล
    const generateMonthlyData = () => {
      const monthlyData = [];
      MOCK_PROJECTS.forEach(project => {
        Object.entries(project.yearly_actuals).forEach(([yearStr, yearlyTotal]) => {
          const year = parseInt(yearStr);
          // แบ่งยอดปีงบประมาณลงรายเดือนแบบสุ่มให้สวยงาม แต่ผลรวมต้องตรงกันเป๊ะ!
          let remaining = yearlyTotal;
          MONTHS_TH.forEach((m, idx) => {
            let actual = 0;
            if (idx === 11) {
              actual = remaining;
            } else {
              actual = Math.min(remaining, Math.floor(Math.random() * (yearlyTotal / 5)));
              remaining -= actual;
            }
            monthlyData.push({
              id: monthlyData.length + 1,
              project_id: project.id,
              project_code: project.project_code,
              project_name: project.project_name,
              branch_name: project.branch_name,
              project_type: project.project_type,
              fiscal_year: year,
              month_number: m.num,
              month_name: m.name,
              actual_users: actual
            });
          });
        });
      });
      return monthlyData;
    };

    const MOCK_MONTHLY_DATA = generateMonthlyData();

    // ประเภทโครงการ
    const PROJECT_TYPES = {
      1: 'โครงการขยายเขตจำหน่ายน้ำ (งบลงทุน)',
      2: 'โครงการขยายเขตจำหน่ายน้ำ (งบอุดหนุน)',
      3: 'โครงการขยายเขตจำหน่ายน้ำ (งบกระตุ้นเศรษฐกิจ)',
      4: 'โครงการวางท่อเข้าซอย'
    };

    const PROJECT_TYPES_SHORT = {
      1: 'งบลงทุน',
      2: 'งบอุดหนุน',
      3: 'งบกระตุ้นเศรษฐกิจ',
      4: 'วางท่อเข้าซอย'
    };

    // --- MAIN APP COMPONENT ---
    function App() {
      const [currentTab, setCurrentTab] = useState('projects'); // 'projects', 'monthly', 'breakeven'

      // Global Filters
      const [filterYear, setFilterYear] = useState('all');
      const [filterBranch, setFilterBranch] = useState('all');
      const [filterType, setFilterType] = useState('all');

      // Search state
      const [searchTerm, setSearchTerm] = useState('');

      // Sorting & Pagination for Screen 1 Datatable
      const [sortField, setSortField] = useState('project_code');
      const [sortDirection, setSortDirection] = useState('asc');
      const [currentPage, setCurrentPage] = useState(1);
      const itemsPerPage = 6;

      // Screen 2 Monthly Selection for Drill-down
      const [selectedBranchDrill, setSelectedBranchDrill] = useState(null);
      const [selectedMonthDrill, setSelectedMonthDrill] = useState(null);
      const [selectedYearDrill, setSelectedYearDrill] = useState(null);

      // Screen 3 Break-even Deep-Dive Selection
      const [selectedProjectId, setSelectedProjectId] = useState(1);

      // Clear Filters
      const resetFilters = () => {
        setFilterYear('all');
        setFilterBranch('all');
        setFilterType('all');
        setSearchTerm('');
      };

      // --- CALCULATIONS FOR DATA ---
      const processedProjects = useMemo(() => {
        return MOCK_PROJECTS.map(proj => {
          const totalActual = Object.values(proj.yearly_actuals).reduce((sum, val) => sum + val, 0);
          return {
            ...proj,
            total_actual_users: totalActual,
            achievement_rate: ((totalActual / proj.target_users) * 100).toFixed(1)
          };
        });
      }, []);

      // Filtered Projects for Screen 1
      const filteredProjects = useMemo(() => {
        return processedProjects.filter(p => {
          const matchesYear = filterYear === 'all' || p.completion_year === parseInt(filterYear);
          const matchesBranch = filterBranch === 'all' || p.branch_name === filterBranch;
          const matchesType = filterType === 'all' || p.project_type === parseInt(filterType);
          const matchesSearch = searchTerm === '' ||
            p.project_code.toLowerCase().includes(searchTerm.toLowerCase()) ||
            p.project_name.toLowerCase().includes(searchTerm.toLowerCase()) ||
            p.contract_no.toLowerCase().includes(searchTerm.toLowerCase()) ||
            p.branch_name.toLowerCase().includes(searchTerm.toLowerCase());

          return matchesYear && matchesBranch && matchesType && matchesSearch;
        });
      }, [processedProjects, filterYear, filterBranch, filterType, searchTerm]);

      // Sorted & Paginated Projects
      const sortedProjects = useMemo(() => {
        const sorted = [...filteredProjects];
        sorted.sort((a, b) => {
          let aVal = a[sortField];
          let bVal = b[sortField];
          if (typeof aVal === 'string') {
            aVal = aVal.toLowerCase();
            bVal = bVal.toLowerCase();
          }
          if (aVal < bVal) return sortDirection === 'asc' ? -1 : 1;
          if (aVal > bVal) return sortDirection === 'asc' ? 1 : -1;
          return 0;
        });
        return sorted;
      }, [filteredProjects, sortField, sortDirection]);

      const paginatedProjects = useMemo(() => {
        const startIdx = (currentPage - 1) * itemsPerPage;
        return sortedProjects.slice(startIdx, startIdx + itemsPerPage);
      }, [sortedProjects, currentPage]);

      const totalPages = Math.ceil(sortedProjects.length / itemsPerPage);

      // Handle Sorting Click
      const handleSort = (field) => {
        if (sortField === field) {
          setSortDirection(sortDirection === 'asc' ? 'desc' : 'asc');
        } else {
          setSortField(field);
          setSortDirection('asc');
        }
      };

      // Export Datatable to CSV
      const handleExportCSV = () => {
        const headers = ['รหัสโครงการ', 'เลขสัญญา', 'สาขา', 'ชื่อโครงการ', 'ปีเริ่มสร้าง', 'ปีแล้วเสร็จ', 'งบประมาณ', 'ประเภท', 'เป้าหมายผู้ใช้', 'ผู้ใช้จริง'];
        const rows = filteredProjects.map(p => [
          p.project_code,
          p.contract_no,
          p.branch_name,
          p.project_name,
          p.start_year,
          p.completion_year,
          p.budget,
          PROJECT_TYPES_SHORT[p.project_type],
          p.target_users,
          p.total_actual_users
        ]);

        let csvContent = '\uFEFF'; // Add BOM for Excel UTF-8 compatibility
        csvContent += headers.join(',') + '\n';
        rows.forEach(row => {
          const escapedRow = row.map(v => `"${String(v).replace(/"/g, '""')}"`);
          csvContent += escapedRow.join(',') + '\n';
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', `pwa6_projects_${new Date().toISOString().split('T')[0]}.csv`);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // Screen 2 Data Grid aggregation (Branch x Month)
      const monthlyBranchGrid = useMemo(() => {
        const grid = {};
        MOCK_BRANCHES.forEach(b => {
          grid[b.name] = {};
          MONTHS_TH.forEach(m => {
            grid[b.name][m.num] = 0;
          });
        });

        MOCK_MONTHLY_DATA.forEach(item => {
          const matchesYear = filterYear === 'all' || item.fiscal_year === parseInt(filterYear);
          const matchesBranch = filterBranch === 'all' || item.branch_name === filterBranch;
          const matchesType = filterType === 'all' || item.project_type === parseInt(filterType);

          if (matchesYear && matchesBranch && matchesType) {
            if (grid[item.branch_name] && grid[item.branch_name][item.month_number] !== undefined) {
              grid[item.branch_name][item.month_number] += item.actual_users;
            }
          }
        });

        return grid;
      }, [filterYear, filterBranch, filterType]);

      // Screen 2 Drill Down List
      const drillDownProjects = useMemo(() => {
        if (!selectedBranchDrill || !selectedMonthDrill || !selectedYearDrill) return [];

        // กรองข้อมูลรายโครงการที่มีส่วนร่วมในผลงานของเดือนนั้น
        const projectsInMonth = [];
        MOCK_MONTHLY_DATA.forEach(item => {
          if (
            item.branch_name === selectedBranchDrill &&
            item.month_number === selectedMonthDrill &&
            item.fiscal_year === selectedYearDrill &&
            item.actual_users > 0
          ) {
            projectsInMonth.push({
              project_code: item.project_code,
              project_name: item.project_name,
              project_type: item.project_type,
              actual_users: item.actual_users
            });
          }
        });
        return projectsInMonth;
      }, [selectedBranchDrill, selectedMonthDrill, selectedYearDrill]);

      // KPI Aggregates
      const kpis = useMemo(() => {
        let count = 0;
        let totalBudget = 0;
        let totalTarget = 0;
        let totalActual = 0;

        filteredProjects.forEach(p => {
          count++;
          totalBudget += p.budget;
          totalTarget += p.target_users;
          totalActual += p.total_actual_users;
        });

        return {
          count,
          totalBudget: totalBudget.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
          totalTarget: totalTarget.toLocaleString('th-TH'),
          totalActual: totalActual.toLocaleString('th-TH'),
          overallAchievement: totalTarget > 0 ? ((totalActual / totalTarget) * 100).toFixed(1) : '0.0'
        };
      }, [filteredProjects]);

      // --- RENDERING CHARTS ---
      const chartRef1 = useRef(null);
      const chartRef2 = useRef(null);
      const chartRef3 = useRef(null);
      const chartRef4 = useRef(null);
      const chartInstance1 = useRef(null);
      const chartInstance2 = useRef(null);
      const chartInstance3 = useRef(null);
      const chartInstance4 = useRef(null);

      // Effect for Tab 1 Charts
      useEffect(() => {
        if (currentTab !== 'projects') return;

        // 1. Chart by Branch (Target vs Actual)
        const branchData = {};
        MOCK_BRANCHES.forEach(b => {
          branchData[b.name] = { target: 0, actual: 0 };
        });

        filteredProjects.forEach(p => {
          if (branchData[p.branch_name]) {
            branchData[p.branch_name].target += p.target_users;
            branchData[p.branch_name].actual += p.total_actual_users;
          }
        });

        const branchLabels = Object.keys(branchData);
        const branchTargets = branchLabels.map(l => branchData[l].target);
        const branchActuals = branchLabels.map(l => branchData[l].actual);

        if (chartInstance1.current) chartInstance1.current.destroy();
        const ctx1 = chartRef1.current.getContext('2d');
        chartInstance1.current = new Chart(ctx1, {
          type: 'bar',
          data: {
            labels: branchLabels,
            datasets: [
              {
                label: 'เป้าหมายผู้ใช้น้ำ (ราย)',
                data: branchTargets,
                backgroundColor: 'rgba(11, 37, 69, 0.7)',
                borderColor: '#0B2545',
                borderWidth: 1,
                borderRadius: 4
              },
              {
                label: 'ผู้ใช้น้ำที่เกิดจริง (ราย)',
                data: branchActuals,
                backgroundColor: 'rgba(225, 29, 72, 0.85)',
                borderColor: '#E11D48',
                borderWidth: 1,
                borderRadius: 4
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: 'top', labels: { font: { family: 'Sarabun' } } }
            },
            scales: {
              y: { beginAtZero: true, ticks: { font: { family: 'Sarabun' } } },
              x: { ticks: { font: { family: 'Sarabun' } } }
            }
          }
        });

        // 2. Chart by Project Type
        const typeData = { 1: { target: 0, actual: 0 }, 2: { target: 0, actual: 0 }, 3: { target: 0, actual: 0 }, 4: { target: 0, actual: 0 } };
        filteredProjects.forEach(p => {
          if (typeData[p.project_type]) {
            typeData[p.project_type].target += p.target_users;
            typeData[p.project_type].actual += p.total_actual_users;
          }
        });

        const typeLabels = Object.values(PROJECT_TYPES_SHORT);
        const typeTargets = [1, 2, 3, 4].map(t => typeData[t].target);
        const typeActuals = [1, 2, 3, 4].map(t => typeData[t].actual);

        if (chartInstance2.current) chartInstance2.current.destroy();
        const ctx2 = chartRef2.current.getContext('2d');
        chartInstance2.current = new Chart(ctx2, {
          type: 'bar',
          data: {
            labels: typeLabels,
            datasets: [
              {
                label: 'เป้าหมายสะสม',
                data: typeTargets,
                backgroundColor: 'rgba(6, 182, 212, 0.75)',
                borderColor: '#06B6D4',
                borderWidth: 1,
                borderRadius: 4
              },
              {
                label: 'ผู้ใช้จริงสะสม',
                data: typeActuals,
                backgroundColor: 'rgba(13, 148, 136, 0.85)',
                borderColor: '#0D9488',
                borderWidth: 1,
                borderRadius: 4
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: 'top', labels: { font: { family: 'Sarabun' } } }

              y: { beginAtZero: true, ticks: { font: { family: 'Sarabun' } } },
              x: { ticks: { font: { family: 'Sarabun' } } }
            }
          }
        });

      }, [currentTab, filteredProjects]);

      // Effect for Tab 2 Charts (Monthly trend line chart)
      useEffect(() => {
        if (currentTab !== 'monthly') return;

        // ดึงแนวโน้มรายเดือนของข้อมูลทั้งหมดที่กรอง
        const monthlyTotals = Array(12).fill(0);
        MOCK_MONTHLY_DATA.forEach(item => {
          const matchesYear = filterYear === 'all' || item.fiscal_year === parseInt(filterYear);
          const matchesBranch = filterBranch === 'all' || item.branch_name === filterBranch;
          const matchesType = filterType === 'all' || item.project_type === parseInt(filterType);

          if (matchesYear && matchesBranch && matchesType) {
            const mIdx = MONTHS_TH.findIndex(m => m.num === item.month_number);
            if (mIdx !== -1) {
              monthlyTotals[mIdx] += item.actual_users;
            }
          }
        });

        if (chartInstance3.current) chartInstance3.current.destroy();
        const ctx3 = chartRef3.current.getContext('2d');
        chartInstance3.current = new Chart(ctx3, {
          type: 'line',
          data: {
            labels: MONTHS_TH.map(m => m.name),
            datasets: [
              {
                label: 'จำนวนผู้ใช้น้ำที่เกิดขึ้นจริงสะสมในเขต 6 (ราย)',
                data: monthlyTotals,
                fill: true,
                backgroundColor: 'rgba(0, 86, 179, 0.1)',
                borderColor: '#0056B3',
                tension: 0.35,
                borderWidth: 3,
                pointBackgroundColor: '#E11D48',
                pointHoverRadius: 7
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: 'top', labels: { font: { family: 'Sarabun', size: 12 } } }
            },
            scales: {
              y: { beginAtZero: true, ticks: { font: { family: 'Sarabun' } } },
              x: { ticks: { font: { family: 'Sarabun' } } }
            }
          }
        });

      }, [currentTab, filterYear, filterBranch, filterType]);

      // Effect for Tab 3 Deep-Dive Project Break-even Timeline Chart
      const projectDeepDive = useMemo(() => {
        return processedProjects.find(p => p.id === selectedProjectId) || processedProjects[0];
      }, [processedProjects, selectedProjectId]);

      const breakEvenData = useMemo(() => {
        if (!projectDeepDive) return { years: [], targets: [], actuals: [], cumulativeTargets: [], cumulativeActuals: [] };

        const type = projectDeepDive.project_type;
        const compYear = projectDeepDive.completion_year;

        if (type === 4) {
          // โครงการวางท่อเข้าซอย ประเมินเพียงแค่ปีที่แล้วเสร็จปีเดียว
          return {
            years: [`ปีที่แล้วเสร็จ (${compYear})`],
            targets: [projectDeepDive.target_users],
            actuals: [projectDeepDive.yearly_actuals[compYear] || 0],
            cumulativeTargets: [projectDeepDive.target_users],
            cumulativeActuals: [projectDeepDive.yearly_actuals[compYear] || 0],
            allocations: [100]
          };
        } else {
          // โครงการประเภท 1-3 ประเมิน 5 ปีสะสม (ปี 0: 40%, ปี 1-4: 15% ต่อปี)
          const yearsList = [];
          const targetsList = [];
          const actualsList = [];
          const cumulativeTargetsList = [];
          const cumulativeActualsList = [];
          const allocations = [40, 15, 15, 15, 15]; // Year 0, 1, 2, 3, 4

          let cumTarget = 0;
          let cumActual = 0;

          // 6 ปี (ปีแล้วเสร็จ + ปีที่ 1-5 ตามตัวอย่าง)
          for (let i = 0; i <= 5; i++) {
            const currentYear = compYear + i;
            const label = i === 0 ? `ปีที่แล้วเสร็จ (${currentYear})` : `ปีที่ ${i} (${currentYear})`;
            yearsList.push(label);

            // คำนวณเป้าหมายรายปี
            let yearTarget = 0;
            if (i <= 4) {
              yearTarget = Math.round(projectDeepDive.target_users * (allocations[i] / 100));
            }
            targetsList.push(yearTarget);

            // เก็บสะสมเป้าหมาย
            cumTarget += yearTarget;
            cumulativeTargetsList.push(cumTarget);

            // ยอดที่เกิดขึ้นจริง
            const yearActual = projectDeepDive.yearly_actuals[currentYear] || 0;
            actualsList.push(yearActual);

            // เก็บสะสมจริง
            cumActual += yearActual;
            cumulativeActualsList.push(cumActual);
          }

          return {
            years: yearsList,
            targets: targetsList,
            actuals: actualsList,
            cumulativeTargets: cumulativeTargetsList,
            cumulativeActuals: cumulativeActualsList,
            allocations: [...allocations, 0] // ปี 5 ไม่มี allocation
          };
        }
      }, [projectDeepDive]);

      useEffect(() => {
        if (currentTab !== 'breakeven' || !projectDeepDive) return;

        if (chartInstance4.current) chartInstance4.current.destroy();
        const ctx4 = chartRef4.current.getContext('2d');
        chartInstance4.current = new Chart(ctx4, {

          // เช็กคุ้มทุน:
          if (type === 4) {
            const comp = p.completion_year;
            const act = p.yearly_actuals[comp] || 0;
            if (act >= p.target_users) {

            if (p.total_actual_users >= p.target_users) {
              summary[type].breakevenCount++;
            }
          }
        });

        return summary;
      }, [processedProjects]);

                    }`}

                </button>

              <p class="font-light">รุ่นฐานข้อมูล: Local Server 8.4.9</p>

          {/* --- MAIN CONTENT AREA --- */}

                                </div>
                              )}
                            </div>
                          </div>

                          {/* Technical Note */}
                          <div class="p-4 bg-slate-900 text-slate-400 rounded-xl text-xs space-y-2 leading-relaxed">
                            <span class="font-bold text-cyan-400 block font-display">📌 เกณฑ์คิดจุดคุ้มทุน กปภ.ข.6:</span>
                            {projectDeepDive.project_type === 4 ? (
                              <p>เนื่องจากเป็น <strong class="text-slate-200">"โครงการประเภท 4: โครงการวางท่อเข้าซอย"</strong> จะคิดคุ้มทุนเพียง 1 ปี คือในปีงบประมาณที่แล้วเสร็จเป็นหลัก โดยผลลัพธ์จริงต้องได้เท่ากับเป้าหมาย (100%) ทันที</p>
                            ) : (
                              <p>เนื่องจากเป็น <strong class="text-slate-200">"โครงการประเภท 1-3: โครงการจำหน่ายน้ำจำแนกตามงบ"</strong> จะใช้เกณฑ์ประเมินสะสมขยายเขตสะสม 5 ปี โดยเฉลี่ยปีที่แล้วเสร็จ (ปี 0) = 40% และปี 1-4 = ปีละ 15%</p>
                            )}
                          </div>
                        </div>

                        {/* Chart and Milestone Timeline Grid */}
                        <div class="lg:col-span-2 space-y-6">
                          {/* Live Payback Chart */}
                          <div class="bg-slate-50 p-6 rounded-xl border border-slate-200 shadow-inner">
                            <h4 class="text-xs font-extrabold text-slate-500 uppercase tracking-widest mb-3">กราฟวิเคราะห์แนวโน้มจุดคุ้มทุนสะสม (Cumulative Targets vs Actual)</h4>
                            <div class="h-64">
                              <canvas ref={chartRef4}></canvas>
                            </div>
                          </div>

                          {/* Milestone Timeline cards */}
                          <div class="grid grid-cols-1 md:grid-cols-5 gap-3">
                            {breakEvenData.years.map((yrLabel, idx) => {
                              const act = breakEvenData.actuals[idx] || 0;
                              const tgt = breakEvenData.targets[idx] || 0;
                              const cumAct = breakEvenData.cumulativeActuals[idx] || 0;
                              const cumTgt = breakEvenData.cumulativeTargets[idx] || 0;

                              const alloc = breakEvenData.allocations[idx] || 0;
                              const isBreakeven = cumAct >= cumTgt;

                              // อย่าโชว์การ์ดมากเกินไปสำหรับประเภท 4
                              if (projectDeepDive.project_type === 4 && idx > 0) return null;

                              return (
                                <div
                                  key={idx}
                                  class={`p-4 rounded-xl border flex flex-col justify-between transition ${isBreakeven
                                    ? 'bg-emerald-50/70 border-emerald-200 text-emerald-800'
                                    : 'bg-rose-50/60 border-rose-100 text-rose-800'
                                    }`}
                                >
                                  <div>
                                    <span class="text-[9px] font-bold block opacity-60 uppercase">{yrLabel.split(' ')[0]}</span>
                                    <span class="text-[10px] font-bold block text-slate-500 mt-0.5">พ.ศ. {yrLabel.match(/\(([^)]+)\)/)?.[1]}</span>

                                    <div class="my-2 border-t border-dashed border-current/25 pt-2 text-xs">
                                      <div class="flex justify-between"><span>สัดส่วนเกณฑ์:</span><span class="font-bold">{alloc}%</span></div>
                                      <div class="flex justify-between mt-1"><span>เป้าหมายสะสม:</span><span class="font-bold">{cumTgt} ราย</span></div>
                                      <div class="flex justify-between mt-0.5"><span>สะสมเกิดจริง:</span><span class="font-extrabold">{cumAct} ราย</span></div>
                                    </div>
                                  </div>

                                  <div class="pt-2 text-center text-[10px] font-bold border-t border-current/15 mt-2">
                                    {isBreakeven ? (
                                      <span class="text-emerald-700">🟢 คุ้มทุน ({cumAct - cumTgt > 0 ? `+${cumAct - cumTgt}` : '0'})</span>
                                    ) : (
                                      <span class="text-rose-600">🔴 ขาดอีก {cumTgt - cumAct} ราย</span>
                                    )}
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      </div>
                    )}
                  </div>

                </div>
              )}

            </div>
          </main>

        </div>
      );
    }

    // Render components to page
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
